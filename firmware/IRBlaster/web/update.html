<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>עדכון קושחה</title>
<style>body{font:16px system-ui,Arial;max-width:420px;margin:40px auto;padding:0 16px;background:#f1f5f9;color:#0f172a}
.c{background:#fff;border-radius:16px;padding:20px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#0284c7;color:#fff;font:inherit;margin-top:12px}
progress{width:100%;height:14px;margin-top:12px}</style></head><body><div class="c">
<h2>עדכון קושחה</h2><p>בחר קובץ <b>.bin</b> (ב-Arduino IDE: Sketch → Export Compiled Binary)</p>
<input type="file" id="f" accept=".bin"><button onclick="up()">העלה</button><progress id="p" value="0" max="100"></progress><p id="m"></p>
<p><a href="/">חזרה</a></p></div>
<script>let K='';fetch('/api/session').then(r=>r.json()).then(j=>K=j.k).catch(()=>{});function up(){const f=document.getElementById('f').files[0];if(!f)return;const x=new XMLHttpRequest(),d=new FormData();d.append('update',f);
x.upload.onprogress=e=>document.getElementById('p').value=e.loaded/e.total*100;
x.onload=()=>{document.getElementById('m').textContent=x.responseText;if(x.status==200)setTimeout(()=>location.href='/',8000)};
x.open('POST','/update');x.setRequestHeader('X-Key',K);x.send(d)}</script></body></html>
