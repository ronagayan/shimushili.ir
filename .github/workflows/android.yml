name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --stacktrace
      - name: Rename APK + version file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk shimushili-remote.apk
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}}" > version.json
      - uses: actions/upload-artifact@v4
        with:
          name: shimushili-remote
          path: shimushili-remote.apk
      - name: Publish to the "android-latest" release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: אפליקציית שלט – גרסה אחרונה
          prerelease: true
          make_latest: false
          files: |
            shimushili-remote.apk
            version.json
          body: |
            הורדה ישירה לטלפון: https://github.com/${{ github.repository }}/releases/download/android-latest/shimushili-remote.apk
            נבנה מ-${{ github.sha }}
