name: Firmware release

on:
  push:
    branches: [main]
    paths: ["firmware/releases/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest firmware
        run: |
          f=$(ls firmware/releases/IRBlaster-*.bin | sort -V | tail -1)
          v=$(basename "$f" .bin | sed 's/IRBlaster-//')
          cp "$f" firmware.bin
          echo "{\"version\": \"$v\"}" > version.json
          echo "Publishing $v"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-latest
          name: קושחת שלט – גרסה אחרונה
          prerelease: true
          make_latest: false
          files: |
            firmware.bin
            version.json
          body: האפליקציה מעדכנת את השלט מכאן (הגדרות ← עדכון קושחה).
